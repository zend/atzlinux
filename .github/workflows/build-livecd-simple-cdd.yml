name: Build LiveCD

on:
  push:
    branches:
      - '**'
      - '!master'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-livecd:
    runs-on: ubuntu-22.04
    name: Build AtzLinux LiveCD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            simple-cdd \
            debian-cd \
            debootstrap \
            squashfs-tools \
            xorriso \
            syslinux-utils \
            isolinux \
            gnupg

      - name: Import AtzLinux GPG key
        run: |
          # Import AtzLinux repository GPG key
          gpg --keyserver keyserver.ubuntu.com --recv-keys 942C9D1AD9A5707E
          gpg --export 942C9D1AD9A5707E | sudo tee /usr/share/keyrings/atzlinux-archive-keyring.gpg > /dev/null
          sudo cp /usr/share/keyrings/atzlinux-archive-keyring.gpg /etc/apt/trusted.gpg.d/

      - name: Build LiveCD
        run: |
          cd isodvd
          # Build using simple-cdd with live option
          sudo build-simple-cdd \
            --debug \
            --dvd \
            --dist bookworm \
            --locale zh_CN \
            --keyboard us \
            --debian-mirror https://deb.debian.org/debian/ \
            --security-mirror https://deb.debian.org/debian-security/ \
            --extra-mirror http://deb.atzlinux.com:60000/atzlinux/ \
            --extra-mirror https://apt.atzlinux.com/atzlinux/ \
            -b profiles/amd64-xfce.build.conf \
            --profiles atzlinux-amd64-xfce

      - name: Upload LiveCD artifact
        uses: actions/upload-artifact@v4
        with:
          name: atzlinux-livecd
          path: /tmp/images/*.iso
          retention-days: 7

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/images/*.iso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
