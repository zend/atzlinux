name: Build LiveCD

on:
  push:
    branches:
      - '**'
      - '!master'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-livecd:
    runs-on: ubuntu-latest
    name: Build AtzLinux LiveCD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            syslinux-utils \
            isolinux \
            gnupg

      - name: Import AtzLinux GPG key
        run: |
          # Import AtzLinux repository GPG key
          gpg --keyserver keyserver.ubuntu.com --recv-keys 942C9D1AD9A5707E
          gpg --export 942C9D1AD9A5707E | sudo tee /usr/share/keyrings/atzlinux-archive-keyring.gpg > /dev/null
          sudo cp /usr/share/keyrings/atzlinux-archive-keyring.gpg /etc/apt/trusted.gpg.d/

      - name: Build LiveCD
        run: |
          cd isodvd/livecd
          sudo ./build-livecd.sh --mirror debian

      - name: Upload LiveCD artifact
        uses: actions/upload-artifact@v4
        with:
          name: atzlinux-livecd
          path: /tmp/livecd/*.iso
          retention-days: 7

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/livecd/*.iso
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
