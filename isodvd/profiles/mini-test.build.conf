mirror_components="main contrib non-free non-free-firmware"

debian_mirror_extra="http://apt-lan/atzlinux/"
mirror_components_extra="main contrib non-free non-free-firmware"
keyring=/usr/share/keyrings/debian-archive-keyring.gpg,/usr/share/keyrings/atzlinux-archive-keyring.gpg

profiles="mini-test"
