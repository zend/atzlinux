mirror_components="main contrib non-free non-free-firmware"

debian_mirror_extra="http://localhost/atzlinux/"
mirror_components_extra="main contrib non-free non-free-firmware"
keyring=/usr/share/keyrings/debian-archive-keyring.gpg,/usr/share/keyrings/atzlinux-archive-keyring.gpg

profiles="atzlinux-amd64-xfce atzlinux-amd64-gnome atzlinux-amd64-xall atzlinux-amd64-kde atzlinux-amd64-xfce-mini atzlinux-amd64-txt-tech"
default_profiles='atzlinux-amd64-xfce'
kernel_packages='linux-image-rt-amd64'

backports="true"
backports_packages='
curl,
hardinfo2,
iptux,
yt-dlp,
linux-image-6.10.6+bpo-rt-amd64,
linux-image-rt-amd64,
linux-kbuild-6.10.6+bpo,
linux-headers-6.10.6+bpo-common-rt,
linux-headers-6.10.6+bpo-rt-amd64,
linux-headers-rt-amd64,
linux-libc-dev,
linux-perf,
libcpupower1,
linux-cpupower,
'

BOOT_TIMEOUT=38
export DISKINFO="atzlinux 12.7.1 bookworm"
export DEBFULLNAME='肖盛文'
export JIGDO_CHECKSUM="md5"
export MAXJIGDOS=ALL
export CHECKSUMS="md5 sha1 sha512 sha256"
export ARCHES="amd64"
export DEBVERSION="12.7.1"
export CDNAME="atzlinux"

# Set to 1 to save space by omitting the installation manual.
# If so the README will link to the manual on the web site.
export OMIT_MANUAL=1

# Set to 1 to save space by omitting the release notes
# If so we will link to them on the web site.
export OMIT_RELEASE_NOTES=1

# Set this to override the default location
export RELEASE_NOTES_LOCATION="https://www.atzlinux.com/News/"

# Set to 1 to not include the doc/tools directories on CD1
# Useful to save space and avoids failures if you have a mirror
# without those directories.
export OMIT_DOC_TOOLS=1

# Do I want to force (potentially non-free) firmware packages to be
# placed on disc 1? Will make installation much easier if systems
# contain hardware that depends on this firmware
export FORCE_FIRMWARE=1
export NONFREE_COMPONENTS="non-free non-free-firmware"

# workaround a bug with simple-cdd not fetching dep11 files
# might require not-yet-uploaded debian-cd (built from git,works perfectly).
export DEP11=0

export DISKINFO_DISTRO="atzlinux"
export VOLID_BASE="atzlinux $DEBVERSION"
